description: |
  Native Kotlin Android access to your Tower workspaces: chat, tasks, documents, files,
  Deck, canvases, task trees and Nostr-enabled web apps. Shared workspace, scope and
  channel navigation, durable drafts and queued writes, isolated editors and browser,
  and privacy-stripped photo attachments. Requires your own Nostr identity and HTTPS Tower.
  See the repository feature matrix for unsupported features and validation limits.
